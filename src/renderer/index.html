<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:"
    />
    <title>Nexus</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Opaque chrome. Everything below #chrome floats over the page. -->
    <div id="chrome">
      <div id="tabstrip">
        <!-- Reserves the macOS traffic lights and doubles as a window drag handle. -->
        <div id="traffic-light-spacer"></div>
        <div id="tabs" role="tablist"></div>
        <button id="new-tab" class="icon-btn" title="New Tab (⌘T)" aria-label="New tab">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 3.5v9M3.5 8h9" />
          </svg>
        </button>
        <div id="strip-drag"></div>
      </div>

      <div id="toolbar">
        <button id="back" class="icon-btn" title="Back (⌘[)" aria-label="Back">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" /></svg>
        </button>
        <button id="forward" class="icon-btn" title="Forward (⌘])" aria-label="Forward">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" /></svg>
        </button>
        <button id="reload" class="icon-btn" title="Reload (⌘R)" aria-label="Reload">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13 8a5 5 0 1 1-1.6-3.7M13 2v3h-3" />
          </svg>
        </button>
        <button id="stop" class="icon-btn" title="Stop (Esc)" aria-label="Stop" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
        </button>
        <button id="home" class="icon-btn" title="Home (⌘⇧H)" aria-label="Home">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 7.5L8 3l5.5 4.5M4 7v6h8V7" />
          </svg>
        </button>

        <div id="address-wrap">
          <span id="scheme-badge" aria-hidden="true"></span>
          <input
            id="address"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Search or enter address"
            aria-label="Address and search bar"
          />
          <button id="star" class="icon-btn inline" title="Bookmark (⌘D)" aria-label="Bookmark">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 2.5l1.7 3.5 3.8.5-2.8 2.7.7 3.8L8 11.2 4.6 13l.7-3.8L2.5 6.5l3.8-.5z" />
            </svg>
          </button>
        </div>

        <button id="apps-btn" class="icon-btn" title="Quick links (⌘⇧A)" aria-label="Quick links">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2.5" y="2.5" width="4" height="4" rx="1" />
            <rect x="9.5" y="2.5" width="4" height="4" rx="1" />
            <rect x="2.5" y="9.5" width="4" height="4" rx="1" />
            <rect x="9.5" y="9.5" width="4" height="4" rx="1" />
          </svg>
        </button>
        <button id="assistant-btn" class="icon-btn" title="Side panel (⌘J)" aria-label="Toggle side panel">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 12.5V4.5A1.5 1.5 0 0 1 4.5 3h7A1.5 1.5 0 0 1 13 4.5v8A1.5 1.5 0 0 1 11.5 14h-7A1.5 1.5 0 0 1 3 12.5z" />
            <path d="M9.5 3v11" />
          </svg>
        </button>
        <button id="downloads-btn" class="icon-btn" title="Downloads" aria-label="Downloads">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 2.5v7M5 7l3 3 3-3M3 12.5h10" />
          </svg>
          <span id="downloads-dot" hidden></span>
        </button>
      </div>

      <div id="progress" hidden></div>
    </div>

    <!-- Transparent overlay layer; the page below shows through the gaps. -->
    <div id="overlays">
      <div id="suggestions" role="listbox" hidden></div>

      <div id="findbar" hidden>
        <input id="find-input" type="text" placeholder="Find in page" aria-label="Find in page" />
        <span id="find-count">0/0</span>
        <button id="find-prev" class="icon-btn" title="Previous" aria-label="Previous match">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5-5 5 5" /></svg>
        </button>
        <button id="find-next" class="icon-btn" title="Next" aria-label="Next match">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" /></svg>
        </button>
        <button id="find-close" class="icon-btn" title="Close" aria-label="Close find bar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
        </button>
      </div>

      <div id="apps-panel" hidden>
        <header>
          <span>Quick links</span>
          <button id="apps-reset" class="text-btn">Reset</button>
        </header>
        <div id="apps-grid" class="apps-grid"></div>
        <form id="apps-add" class="apps-add" autocomplete="off">
          <input id="apps-name" class="apps-field" type="text" placeholder="Name" aria-label="Site name" />
          <input id="apps-url" class="apps-field" type="text" placeholder="example.com" aria-label="Site address" />
          <button class="apps-add-btn" type="submit" aria-label="Add site">Add</button>
        </form>
      </div>

      <div id="downloads-panel" hidden>
        <header>
          <span>Downloads</span>
          <button id="downloads-clear" class="text-btn">Clear</button>
        </header>
        <ul id="downloads-list"></ul>
        <p id="downloads-empty">No downloads yet.</p>
      </div>

      <div id="permission" hidden>
        <p id="permission-text"></p>
        <div class="permission-actions">
          <button id="permission-deny" class="text-btn">Block</button>
          <button id="permission-allow" class="text-btn primary">Allow</button>
        </div>
      </div>
    </div>

    <script type="module" src="./chrome.ts"></script>
  </body>
</html>
