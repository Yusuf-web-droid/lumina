# Builds Lumina for all three platforms and attaches the results to the release
# for whichever tag was pushed. Windows installers need Wine and Linux packages
# need Docker when cross-built from a Mac, so they are built on their own
# runners instead — this is the only way the non-Mac artifacts get made.
name: Release

on:
  push:
    tags: ['v*']
  # So a build can be tried without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the others: a broken Linux
      # build is no reason to lose a working Mac one.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            flag: --mac
          - os: windows-latest
            label: Windows
            flag: --win
          - os: ubuntu-latest
            label: Linux
            flag: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Both run on every platform: a type error or a failing test should stop
      # the release, not ship alongside it.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build
      - run: npx electron-builder ${{ matrix.flag }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: lumina-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Job-level permissions replace the workflow's, so contents is repeated
    # here. The other two exist only to sign provenance, and only this job
    # needs them — the build jobs stay on read-only defaults.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # download-artifact nests each runner's output under its own directory.
      # Flatten it, so the checksum file lists bare filenames — the names
      # someone actually has on disk after downloading.
      - name: Collect the installers
        run: |
          mkdir -p release
          find artifacts -type f -exec mv -t release {} +
          ls -l release

      - name: Write the checksums
        working-directory: release
        run: |
          # Written outside the directory first: `*` would otherwise expand to
          # include the file being written into.
          sha256sum * > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" .
          cat SHA256SUMS.txt

      # The project has no signing certificate, so this is the only proof on
      # offer that an installer is what it claims: a Sigstore-signed statement
      # that these exact bytes left this workflow, at this commit. It does not
      # quiet SmartScreen or Gatekeeper — nothing but a paid certificate does —
      # but it is what `gh attestation verify` checks against.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release may not exist yet if the tag was pushed on its own.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "Lumina ${TAG#v}" --notes "See CHANGELOG.md."
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
