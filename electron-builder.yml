appId: dev.lumina.browser
productName: Lumina
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

# The shipped start-page photos. `files` only covers the asar, so these are
# copied into the app's Contents/Resources instead — see backgroundPresets.ts.
extraResources:
  - from: resources/backgrounds
    to: backgrounds

mac:
  category: public.app-category.productivity
  # Both architectures: every Mac sold since 2020 is Apple Silicon, and an
  # x64-only build runs there under Rosetta. Separate artifacts rather than a
  # universal binary, so neither download carries the other's slice.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: dir
      arch: [x64, arm64]
  # Unsigned: fine for personal use. Distributing to others needs an Apple
  # Developer ID plus notarization, at which point set identity and enable
  # hardened runtime + entitlements.
  identity: null
  minimumSystemVersion: "12.0"

# Windows and Linux carry no signing identity either, so both warn on first
# run the way the Mac build does. The icon is converted from resources/icon.png.
win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  # A real installer with a directory choice, rather than a one-click that
  # drops the app into AppData without asking.
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Network
  # Debian wants "Name <email>" here; left as a bare name until one is chosen.
  maintainer: Yusuf-web-droid
  synopsis: A minimal desktop web browser built on Electron

dmg:
  title: Lumina
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
